<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全国病院MAP</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--paper:#f4f3ef;--ink:#171717;--muted:#73736f;--line:#d8d6cf;--panel:#fbfaf7;--accent:#202b33;--hospital:#202b33;--bedded:#715f4a;--clinic:#9a968b}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:"Atkinson Hyperlegible","Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
body{overflow:hidden}.app{display:grid;grid-template-columns:360px 1fr;height:100dvh}.side{position:relative;z-index:500;background:rgba(251,250,247,.97);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.head{padding:22px 22px 16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700}.title{font-size:24px;letter-spacing:-.03em;margin:4px 0 2px;font-weight:700}.sub{font-size:11px;color:var(--muted);line-height:1.5}
.controls{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input{width:100%;border:1px solid var(--line);background:white;color:var(--ink);border-radius:3px;padding:10px 11px;font-size:13px;outline:none}
input:focus,select:focus{border-color:#9a9993}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.typebtn{border:1px solid var(--line);background:transparent;padding:8px 4px;border-radius:3px;font-size:11px;cursor:pointer}.typebtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.statusline{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}.statusline input{width:auto}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.metric{background:var(--panel);padding:12px 14px}.metric b{display:block;font-size:17px}.metric span{font-size:9px;color:var(--muted);letter-spacing:.08em}
.listhead{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.list{overflow:auto;flex:1;padding:0 10px 16px}
.card{padding:12px 8px;border-top:1px solid var(--line);cursor:pointer}.card:hover{background:#f0efea}.card h3{font-size:13px;margin:0 0 5px;line-height:1.35}.card p{font-size:10px;color:var(--muted);margin:2px 0;line-height:1.4}.badge{display:inline-block;font-size:9px;padding:2px 5px;border:1px solid var(--line);margin-right:4px;border-radius:2px}.badge.care{border-color:#697b67;background:#eef1eb;color:#31412f}.badge.home{border-color:#6b647c;background:#f0edf4;color:#383143}.homewarn{font-size:10px;color:#8a5b45;line-height:1.4}
.mapwrap{position:relative;min-width:0}.map{height:100%;width:100%;background:#e9e8e3}.coverage{position:absolute;z-index:450;right:16px;top:16px;background:rgba(251,250,247,.94);border:1px solid var(--line);padding:9px 11px;font-size:10px;line-height:1.4;max-width:260px}.coverage strong{font-size:12px}
.empty{padding:28px 16px;color:var(--muted);font-size:12px;line-height:1.7}
.pin{width:13px;height:13px;border:2px solid white;box-shadow:0 1px 3px rgba(0,0,0,.35)}.pin.hospital{background:var(--hospital);border-radius:2px}.pin.bedded{background:var(--bedded);border-radius:50%}.pin.clinic{background:var(--clinic);border-radius:50%;width:10px;height:10px}
.leaflet-popup-content{font-family:inherit;min-width:230px}.pop h3{font-size:14px;margin:0 0 7px}.pop p{font-size:11px;color:#555;margin:4px 0;line-height:1.45}.pop a{color:#293943}
.mobileToggle{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:absolute;left:0;top:0;bottom:0;width:min(88vw,360px);transform:translateX(-100%);transition:.22s ease;box-shadow:8px 0 30px rgba(0,0,0,.14)}.side.open{transform:none}.mobileToggle{display:block;position:absolute;z-index:700;left:12px;top:12px;border:1px solid var(--line);background:rgba(251,250,247,.96);padding:9px 11px;border-radius:3px;font-size:12px}.coverage{top:12px;right:12px;max-width:52vw}.mapwrap{height:100dvh}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side">
  <div class="head"><div class="eyebrow">NATIONAL MEDICAL FACILITY INDEX</div><div class="title">全国病院MAP</div><div class="sub">厚生局 2026.09 / 医療情報ネット 2026.06<br>地域包括診療 2026.08.25 / 在宅施設基準 2026.08–09</div></div>
  <div class="controls">
    <select id="pref"><option value="">都道府県を選択</option></select>
    <input id="q" placeholder="施設名・住所・開設者・診療科">
    <div class="row">
      <select id="dept"><option value="">診療科：すべて</option></select>
      <select id="group"><option value="">領域：すべて</option></select>
    </div>
    <select id="regionalCare">
      <option value="">地域包括診療：すべて</option>
      <option value="any">地域包括診療料・加算 取得施設</option>
      <option value="addition">地域包括診療加算</option>
      <option value="fee">地域包括診療料</option>
      <option value="both">両方取得</option>
    </select>
    <select id="homeCare">
      <option value="">在宅施設基準：すべて</option>
      <option value="any">在宅系施設基準あり</option>
      <option value="支援診1">在支診1</option><option value="支援診2ア">在支診2ア</option><option value="支援診2イ">在支診2イ</option><option value="支援診3">在支診3</option>
      <option value="支援病1">在支病1</option><option value="支援病2">在支病2</option><option value="支援病3">在支病3</option>
      <option value="在充診">在充診</option><option value="在充病">在充病</option>
      <option value="在診実1">在診実1</option><option value="在診実2">在診実2</option><option value="在病実1">在病実1</option><option value="在病実2">在病実2</option>
      <option value="在後病">在宅療養後方支援病院</option><option value="介保連">介護保険施設等連携往診加算</option><option value="在宅DX">在宅医療DX</option>
    </select>
    <div id="homeDataNotice" class="homewarn"></div>
    <div class="types">
      <button class="typebtn active" data-type="病院">病院</button>
      <button class="typebtn active" data-type="有床診療所">有床</button>
      <button class="typebtn active" data-type="無床診療所">無床</button>
    </div>
    <label class="statusline"><input id="current" type="checkbox" checked> 現存施設のみ表示</label>
  </div>
  <div class="metrics"><div class="metric"><b id="mTotal">—</b><span>MASTER</span></div><div class="metric"><b id="mMapped">—</b><span>MAPPED</span></div><div class="metric"><b id="mShown">—</b><span>SHOWN</span></div></div>
  <div class="listhead"><span>FACILITIES</span><span id="listNote">都道府県を選択</span></div>
  <div class="list" id="list"><div class="empty">都道府県を選ぶと、該当地域の施設データだけを読み込みます。全国約10万件を一括読込しないため、スマートフォンでも軽く動く構成です。</div></div>
</aside>
<main class="mapwrap"><button class="mobileToggle" id="mobileToggle">MENU</button><div id="map" class="map"></div><div class="coverage" id="coverage"><strong>80,660 / 97,393</strong><br>公式施設座標で表示できる施設。未一致は次工程で住所ジオコーディング。</div></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([37.35,137.2],5);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const clusters=L.markerClusterGroup({chunkedLoading:true,disableClusteringAtZoom:15,showCoverageOnHover:false,maxClusterRadius:42});
map.addLayer(clusters);
let meta=null,data=[],shown=[],activeTypes=new Set(['病院','有床診療所','無床診療所']);
const $=id=>document.getElementById(id);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function icon(type){let c=type==='病院'?'hospital':type==='有床診療所'?'bedded':'clinic';return L.divIcon({className:'',html:`<div class="pin ${c}"></div>`,iconSize:[14,14],iconAnchor:[7,7]})}
function careLabel(v){return v==='both'?'地域包括：加算＋診療料':v==='addition'?'地域包括診療加算':v==='fee'?'地域包括診療料':''}
function homeLabel(x){return (x.homeCareLabels||[]).join(' / ')}
function popup(x){const cb=careLabel(x.regionalCare),hb=homeLabel(x);return `<div class="pop"><h3>${esc(x.name)}</h3>${cb?`<p><span class="badge care">${esc(cb)}</span></p>`:''}${hb?`<p><span class="badge home">${esc(hb)}</span></p>`:''}<p>${esc(x.type)}${x.beds?` ・ ${x.beds}床`:''}<br>${esc(x.address)}</p><p>${esc(x.departments.slice(0,8).join(' / '))}</p>${x.founder?`<p>開設者：${esc(x.founder)}</p>`:''}${x.manager?`<p>管理者：${esc(x.manager)}</p>`:''}${x.url?`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">医療機関サイト ↗</a></p>`:''}</div>`}
function render(){
  clusters.clearLayers();
  const q=$('q').value.trim().toLowerCase(),dept=$('dept').value,group=$('group').value,care=$('regionalCare').value,home=$('homeCare').value,current=$('current').checked;
  shown=data.filter(x=>{
    if(!activeTypes.has(x.type))return false;if(current&&x.status!=='現存')return false;if(dept&&!x.departments.includes(dept))return false;if(group&&!x.groups.includes(group))return false;
    if(care==='any'&&!x.regionalCare)return false;if(care&&care!=='any'&&x.regionalCare!==care)return false;if(home==='any'&&!x.homeCareAny)return false;if(home&&home!=='any'&&!(x.homeCareLabels||[]).includes(home))return false;
    if(q){const hay=[x.name,x.address,x.founder,x.manager,...x.departments,...x.groups].join(' ').toLowerCase();if(!hay.includes(q))return false}return true
  });
  const markers=[];
  shown.forEach(x=>{const m=L.marker([x.lat,x.lng],{icon:icon(x.type),title:x.name}).bindPopup(popup(x));m._facility=x;markers.push(m)});
  clusters.addLayers(markers);
  $('mShown').textContent=shown.length.toLocaleString('ja-JP');
  $('listNote').textContent=shown.length>200?`上位200件 / ${shown.length.toLocaleString()}件`:`${shown.length.toLocaleString()}件`;
  const list=$('list');list.innerHTML='';
  shown.slice(0,200).forEach(x=>{const d=document.createElement('div');d.className='card';const cb=careLabel(x.regionalCare),hb=homeLabel(x);d.innerHTML=`<h3>${esc(x.name)}</h3><p><span class="badge">${esc(x.type)}</span>${x.beds?`<span class="badge">${x.beds}床</span>`:''}${cb?`<span class="badge care">${esc(cb)}</span>`:''}${hb?`<span class="badge home">${esc(hb)}</span>`:''}</p><p>${esc(x.address)}</p><p>${esc(x.departments.slice(0,5).join(' / '))}</p>`;d.onclick=()=>{map.setView([x.lat,x.lng],16);for(const l of clusters.getLayers()){if(l._facility?.id===x.id){clusters.zoomToShowLayer(l,()=>l.openPopup());break}}};list.appendChild(d)});
  if(!shown.length)list.innerHTML='<div class="empty">条件に合う施設がありません。</div>';
}
async function loadPref(code){
  clusters.clearLayers();data=[];$('list').innerHTML='<div class="empty">読み込み中…</div>';
  if(!code){map.setView([37.35,137.2],5);$('mTotal').textContent='—';$('mMapped').textContent='—';$('mShown').textContent='—';return}
  const p=meta.prefectures.find(x=>x.code===code);
  data=await fetch(`data/prefs/${code}.json`).then(r=>r.json());
  $('mTotal').textContent=p.total.toLocaleString();$('mMapped').textContent=p.mapped.toLocaleString();
  $('coverage').innerHTML=`<strong>${p.name} ${p.mapped.toLocaleString()} / ${p.total.toLocaleString()}</strong><br>公式座標カバー率 ${(p.coverage*100).toFixed(1)}%`;
  render(); if(data.length){const b=L.latLngBounds(data.map(x=>[x.lat,x.lng]));map.fitBounds(b.pad(.08))}
}
fetch('data/index.json').then(r=>r.json()).then(x=>{meta=x;const ps=$('pref');x.prefectures.forEach(p=>ps.add(new Option(`${p.name}  ${p.mapped.toLocaleString()}件`,p.code)));x.departments.forEach(d=>$('dept').add(new Option(`${d.name} (${d.count.toLocaleString()})`,d.name)));x.groups.forEach(g=>$('group').add(new Option(`${g.name} (${g.count.toLocaleString()})`,g.name)));});
$('pref').onchange=e=>loadPref(e.target.value);$('q').oninput=render;$('dept').onchange=render;$('group').onchange=render;$('regionalCare').onchange=render;$('homeCare').onchange=render;$('current').onchange=render;
document.querySelectorAll('.typebtn').forEach(b=>b.onclick=()=>{b.classList.toggle('active');b.classList.contains('active')?activeTypes.add(b.dataset.type):activeTypes.delete(b.dataset.type);render()});
$('mobileToggle').onclick=()=>$('side').classList.toggle('open');
map.on('click',()=>{if(innerWidth<=760)$('side').classList.remove('open')});
</script>
</body></html>
