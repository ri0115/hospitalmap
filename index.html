const CARE_NAMES=["","地域包括診療加算","地域包括診療料","加算＋診療料"];
const COLORS=["#236a96","#c56b2e","#4e805d"];
const REF_DATE=new Date("2026-09-01T00:00:00+09:00");
const $=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let data=[],shown=[],activeTypes=new Set([0,1,2]),homeOnly=false,careOnly=false,pinsOn=true;
let map=null,mapLayer=null,mapReady=false,currentChunk=null;

function decodePref(c){
  const dept=c.d;
  return c.r.map(a=>({
    id:a[0],name:a[1],lat:a[2],lng:a[3],type:a[4],current:!!a[5],beds:a[6],
    departments:a[7].map(i=>dept[i]),address:a[8],phone:a[9],founder:a[10],manager:a[11],
    designated:a[12],url:a[13],care:a[14],homeMask:a[15]
  }));
}
function homeLabels(x){let a=[];for(let i=0;i<HOME_LABELS.length;i++)if(x.homeMask&(1<<i))a.push(HOME_LABELS[i]);return a}
function homeHas(x,label){return !!(x.homeMask&HOME_BIT[label])}
function dateObj(n){if(!n)return null;const s=String(n).padStart(8,"0");const d=new Date(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T00:00:00+09:00`);return isNaN(d)?null:d}
function yearsSince(x){const d=dateObj(x.designated);if(!d)return null;let y=REF_DATE.getFullYear()-d.getFullYear();if(REF_DATE.getMonth()<d.getMonth()||(REF_DATE.getMonth()==d.getMonth()&&REF_DATE.getDate()<d.getDate()))y--;return y}
function designatedText(x){const d=dateObj(x.designated),y=yearsSince(x);return d?`${d.getFullYear()}年指定${y!==null?`・${y}年`:""}`:""}
function groupHas(x,g){if(!g)return true;const r=GROUP_RULES.find(a=>a[0]===g);if(!r)return true;const keys=r[1].split("|");return x.departments.some(d=>keys.some(k=>d.includes(k)))}
function badgeType(t){return `<span class="badge ${t===0?"h":t===1?"b":"c"}">${TYPE_NAMES[t]}</span>`}
function cardHTML(x){const hs=homeLabels(x),dt=designatedText(x);return `<h3>${esc(x.name)}</h3><p>${badgeType(x.type)}${x.beds?`<span class="badge">${x.beds}床</span>`:""}${dt?`<span class="badge year">${esc(dt)}</span>`:""}${x.care?`<span class="badge care">${CARE_NAMES[x.care]}</span>`:""}${hs.length?`<span class="badge home">${esc(hs.slice(0,3).join(" / "))}</span>`:""}</p><p>${esc(x.address)}</p><p>${esc(x.departments.slice(0,6).join(" / "))}</p>`}
function popupHTML(x){const hs=homeLabels(x),dt=designatedText(x);return `<div style="font:12px system-ui;min-width:240px"><b style="font-size:14px">${esc(x.name)}</b><p>${badgeType(x.type)}${dt?`<span class="badge year">${esc(dt)}</span>`:""}</p>${x.care?`<p>地域包括：${CARE_NAMES[x.care]}</p>`:""}${hs.length?`<p>在宅：${esc(hs.join(" / "))}</p>`:""}<p>${esc(x.address)}</p><p>${esc(x.departments.slice(0,10).join(" / "))}</p>${x.founder?`<p>開設者：${esc(x.founder)}</p>`:""}${x.manager?`<p>管理者：${esc(x.manager)}</p>`:""}${x.phone?`<p>${esc(x.phone)}</p>`:""}${x.url?`<p><a target="_blank" rel="noopener" href="${esc(x.url)}">医療機関サイト ↗</a></p>`:""}</div>`}

function initMap(){
  if(typeof L==="undefined"){$("maperr").style.display="block";return}
  try{
    map=L.map("map",{zoomControl:true,preferCanvas:true}).setView([37.4,137.3],5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"&copy; OpenStreetMap"}).addTo(map);
    mapLayer=L.layerGroup().addTo(map);mapReady=true;
    map.on("moveend zoomend",drawMap);
  }catch(e){$("maperr").style.display="block"}
}
function drawMap(){
  if(!mapReady||!mapLayer)return;mapLayer.clearLayers();if(!pinsOn||!shown.length)return;
  const b=map.getBounds().pad(.08),visible=shown.filter(x=>b.contains([x.lat,x.lng])),z=map.getZoom();
  const useIndividual=(z>=13&&visible.length<=1800)||(visible.length<=450);
  if(useIndividual){
    for(const x of visible.slice(0,1800)){
      const r=x.type===0?5.2:x.type===1?4.4:3.6;
      L.circleMarker([x.lat,x.lng],{radius:r,color:"#fff",weight:1,fillColor:COLORS[x.type],fillOpacity:.9})
        .bindPopup(popupHTML(x),{maxWidth:330}).addTo(mapLayer);
    }
    return;
  }
  const cell=z<8?58:z<10?48:z<12?40:34,buckets=new Map();
  for(const x of visible){
    const p=map.latLngToContainerPoint([x.lat,x.lng]),k=`${Math.floor(p.x/cell)}:${Math.floor(p.y/cell)}`;
    let v=buckets.get(k);if(!v){v={n:0,lat:0,lng:0,t:[0,0,0],one:x};buckets.set(k,v)}
    v.n++;v.lat+=x.lat;v.lng+=x.lng;v.t[x.type]++;v.one=x;
  }
  for(const v of buckets.values()){
    if(v.n===1){
      const x=v.one;L.circleMarker([x.lat,x.lng],{radius:x.type===0?5:4,color:"#fff",weight:1,fillColor:COLORS[x.type],fillOpacity:.9}).bindPopup(popupHTML(x),{maxWidth:330}).addTo(mapLayer);
    }else{
      const dominant=v.t.indexOf(Math.max(...v.t)),r=Math.min(18,7+Math.log2(v.n)*2);
      L.circleMarker([v.lat/v.n,v.lng/v.n],{radius:r,color:"#fff",weight:1.5,fillColor:COLORS[dominant],fillOpacity:.82})
       .bindTooltip(`${v.n.toLocaleString()}施設`,{direction:"top"})
       .on("click",()=>map.setView([v.lat/v.n,v.lng/v.n],Math.min(15,map.getZoom()+2))).addTo(mapLayer);
    }
  }
}

function filterData(){
  const q=$("q").value.trim().toLowerCase(),dept=$("deptText").value.trim().toLowerCase(),g=$("group").value;
  const age=parseInt($("ageMin").value||"0"),home=$("homeDetail").value,care=parseInt($("careDetail").value||"0");
  return data.filter(x=>{
    if(!activeTypes.has(x.type))return false;if($("current").checked&&!x.current)return false;
    if(dept&&!x.departments.some(d=>d.toLowerCase().includes(dept)))return false;
    if(g&&!groupHas(x,g))return false;
    const y=yearsSince(x);if(age&&(y===null||y<age))return false;
    if(homeOnly&&!x.homeMask)return false;if(home&&!homeHas(x,home))return false;
    if(careOnly&&!x.care)return false;if(care&&x.care!==care)return false;
    if(q){const hay=[x.name,x.address,x.founder,x.manager,...x.departments,...homeLabels(x)].join(" ").toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}
function sortData(a){
  const mode=$("sort").value,ja=(x,y)=>(x||"").localeCompare(y||"","ja"),dt=x=>x.designated||0;
  return [...a].sort((x,y)=>mode==="old"?(dt(x)||99999999)-(dt(y)||99999999)||ja(x.name,y.name):mode==="new"?(dt(y)||0)-(dt(x)||0)||ja(x.name,y.name):mode==="beds"?(y.beds||0)-(x.beds||0)||ja(x.name,y.name):mode==="depts"?(y.departments.length-x.departments.length)||ja(x.name,y.name):mode==="deptname"?ja([...x.departments].sort()[0],[...y.departments].sort()[0])||ja(x.name,y.name):ja(x.name,y.name));
}
function render(){
  shown=filterData();const list=sortData(shown);
  $("mShown").textContent=shown.length.toLocaleString();$("mOld").textContent=shown.filter(x=>(yearsSince(x)??-1)>=50).length.toLocaleString();
  $("listNote").textContent=`${Math.min(120,list.length)} / ${list.length.toLocaleString()}件`;
  const el=$("list");el.innerHTML="";
  for(const x of list.slice(0,120)){const d=document.createElement("div");d.className="card";d.innerHTML=cardHTML(x);d.onclick=()=>{if(mapReady){map.setView([x.lat,x.lng],15);L.popup({maxWidth:330}).setLatLng([x.lat,x.lng]).setContent(popupHTML(x)).openOn(map)}};el.appendChild(d)}
  if(!list.length)el.innerHTML='<div class="empty">条件に合う施設がありません。</div>';
  drawMap();
}
function buildDeptList(){
  const set=new Set();data.forEach(x=>x.departments.forEach(d=>set.add(d)));const dl=$("deptList");dl.innerHTML="";[...set].sort((a,b)=>a.localeCompare(b,"ja")).forEach(d=>{const o=document.createElement("option");o.value=d;dl.appendChild(o)})
}
function loadChunk(cid){return new Promise((resolve,reject)=>{
  if(window.__HOSP_CHUNK__[cid])return resolve(window.__HOSP_CHUNK__[cid]);
  const s=document.createElement("script");s.src=`${cid}.js`;s.onload=()=>resolve(window.__HOSP_CHUNK__[cid]);s.onerror=()=>reject(new Error("データファイルを読み込めません"));document.head.appendChild(s);
})}
async function loadPref(code){
  if(!code){data=[];shown=[];$("list").innerHTML='<div class="empty">都道府県を選択してください。</div>';return}
  const pm=PREF_META[code];$("list").innerHTML='<div class="empty">読み込み中…</div>';
  try{
    const chunk=await loadChunk(pm.chunk),c=chunk[code];data=decodePref(c);buildDeptList();
    $("mMaster").textContent=pm.total.toLocaleString();$("mMapped").textContent=pm.mapped.toLocaleString();
    $("overlay").innerHTML=`<strong>${pm.name}</strong><br>${pm.mapped.toLocaleString()} / ${pm.total.toLocaleString()}施設・座標率 ${(pm.coverage*100).toFixed(1)}%${pm.homeCareSourceDate?`<br>在宅基準 ${pm.homeCareSourceDate}`:""}`;
    render();
    if(mapReady&&data.length){const b=L.latLngBounds(data.map(x=>[x.lat,x.lng]));map.fitBounds(b.pad(.05))}
    if(currentChunk&&currentChunk!==pm.chunk)delete window.__HOSP_CHUNK__[currentChunk];currentChunk=pm.chunk;
  }catch(e){$("list").innerHTML=`<div class="empty">${esc(e.message)}。ZIP展開後、index.htmlとdXX.jsを同じ場所に置いてください。</div>`}
}
function updateQuick(){
  $("toggleHome").classList.toggle("on",homeOnly);$("toggleHome").textContent=`在宅 ${homeOnly?"ON":"OFF"}`;
  $("toggleCare").classList.toggle("on",careOnly);$("toggleCare").textContent=`地域包括 ${careOnly?"ON":"OFF"}`;
  $("togglePins").classList.toggle("on",pinsOn);$("togglePins").textContent=`ピン ${pinsOn?"ON":"OFF"}`;
}
function reset(){
  $("q").value="";$("deptText").value="";$("group").value="";$("ageMin").value="";$("sort").value="name";$("homeDetail").value="";$("careDetail").value="";$("current").checked=true;homeOnly=false;careOnly=false;pinsOn=true;activeTypes=new Set([0,1,2]);document.querySelectorAll(".typebtn").forEach(b=>b.classList.add("active"));updateQuick();render();
}
initMap();updateQuick();
$("pref").onchange=e=>loadPref(e.target.value);$("prefGo").onclick=()=>loadPref($("pref").value);
["q","deptText"].forEach(id=>$(id).oninput=render);["group","ageMin","sort","current","homeDetail","careDetail"].forEach(id=>$(id).onchange=render);
$("toggleHome").onclick=()=>{homeOnly=!homeOnly;if(!homeOnly)$("homeDetail").value="";updateQuick();render()};
$("toggleCare").onclick=()=>{careOnly=!careOnly;if(!careOnly)$("careDetail").value="";updateQuick();render()};
$("togglePins").onclick=()=>{pinsOn=!pinsOn;updateQuick();drawMap()};
document.querySelectorAll(".typebtn").forEach(b=>b.onclick=()=>{b.classList.toggle("active");const t=+b.dataset.type;b.classList.contains("active")?activeTypes.add(t):activeTypes.delete(t);render()});
$("reset").onclick=reset;$("mobile").onclick=()=>$("side").classList.toggle("open");
const qp=new URLSearchParams(location.search).get("pref");if(qp&&PREF_META[qp]){$("pref").value=qp;loadPref(qp)}
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// If Leaflet loads after the main script, initialize it now. Dropdown/list do not depend on Leaflet.
if(!mapReady&&typeof L!=="undefined"){initMap();if(data.length){const b=L.latLngBounds(data.map(x=>[x.lat,x.lng]));map.fitBounds(b.pad(.05));drawMap()}}
</script>
</body>
